name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            shopnest-ecom-MERN-master/package-lock.json

      - name: Install backend dependencies
        working-directory: shopnest-ecom-MERN-master/backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: shopnest-ecom-MERN-master/frontend
        run: npm install

      - name: Build frontend
        working-directory: shopnest-ecom-MERN-master/frontend
        run: npm run build
